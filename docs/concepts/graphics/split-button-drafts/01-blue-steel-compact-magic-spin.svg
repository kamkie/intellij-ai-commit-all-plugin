<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Blue Steel Compact background magic-spin activity animation draft"
     font-family="Inter, Arial, sans-serif">
    <defs>
        <symbol id="ai-mark" viewBox="0 0 22 22">
            <path fill="currentColor" d="M11 1.5l2.7 6.1 6.3 3-6.3 3L11 20l-2.7-6.4-6.3-3 6.3-3z"/>
        </symbol>
        <symbol id="push-mark" viewBox="0 0 18 18">
            <path d="M9 3v9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M5 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                  stroke-linejoin="round"/>
            <path d="M4 15h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </symbol>
        <linearGradient id="magic-light" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
            <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".34"/>
            <stop offset=".55" stop-color="#BFD5FF" stop-opacity=".48"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="magic-dark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
            <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".30"/>
            <stop offset=".55" stop-color="#93C5FD" stop-opacity=".46"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="ai-section-clip">
            <path d="M4 0H50V30H4Q0 30 0 26V4Q0 0 4 0Z"/>
        </clipPath>
        <clipPath id="commit-section-clip">
            <rect x="50" y="0" width="70" height="30"/>
        </clipPath>
        <clipPath id="push-section-clip">
            <path d="M120 0H186Q190 0 190 4V26Q190 30 186 30H120Z"/>
        </clipPath>
    </defs>

    <rect width="900" height="440" fill="#F5F7FB"/>
    <text x="40" y="44" font-size="24" font-weight="700" fill="#1F2937">01d Blue Steel Compact - Background Magic Spin
    </text>
    <text x="40" y="72" font-size="14" fill="#4B5563">Active phase is indicated by a rotating shimmer behind the active
        section.
    </text>

    <g transform="translate(40 110)">
        <rect width="390" height="250" rx="8" fill="#FFFFFF" stroke="#D5D9E2"/>
        <text x="24" y="36" font-size="16" font-weight="700" fill="#1F2937">Light theme</text>

        <g transform="translate(24 74)">
            <text x="0" y="19" font-size="12" fill="#5E6B7A">Staging + AI</text>
            <g transform="translate(124 0)">
                <rect width="190" height="30" rx="4" fill="#EDF2FB"/>
                <path d="M4 0H50V30H4Q0 30 0 26V4Q0 0 4 0Z" fill="#2659C7"/>
                <rect x="50" width="70" height="30" fill="#EAF1FF"/>
                <path d="M120 0H186Q190 0 190 4V26Q190 30 186 30H120Z" fill="#E8F5EC"/>
                <g clip-path="url(#ai-section-clip)">
                    <rect x="-20" y="-30" width="90" height="90" fill="url(#magic-light)" opacity=".9">
                        <animateTransform attributeName="transform" type="rotate" values="0 25 15;360 25 15" dur="1.2s"
                                          repeatCount="indefinite"/>
                    </rect>
                </g>
                <path d="M50 0v30M120 0v30" stroke="#DDE8FF" opacity=".55"/>
                <use href="#ai-mark" x="8" y="8" width="14" height="14" color="#FFFFFF"/>
                <text x="27" y="20" font-size="12" font-weight="700" fill="#FFFFFF">AI</text>
                <text x="62" y="20" font-size="12" font-weight="700" fill="#315FAE">Commit</text>
                <text x="130" y="20" font-size="12" font-weight="700" fill="#238449">Push</text>
                <use href="#push-mark" x="162" y="7" width="18" height="16" color="#238449"/>
                <rect x=".5" y=".5" width="189" height="29" rx="4" fill="none" stroke="#1F2937" opacity=".18"/>
            </g>
        </g>

        <g transform="translate(24 124)">
            <text x="0" y="19" font-size="12" fill="#5E6B7A">Commit running</text>
            <g transform="translate(124 0)">
                <rect width="190" height="30" rx="4" fill="#EDF2FB"/>
                <path d="M4 0H50V30H4Q0 30 0 26V4Q0 0 4 0Z" fill="#2F6EEA"/>
                <rect x="50" width="70" height="30" fill="#2659C7"/>
                <path d="M120 0H186Q190 0 190 4V26Q190 30 186 30H120Z" fill="#E8F5EC"/>
                <g clip-path="url(#commit-section-clip)">
                    <rect x="25" y="-40" width="120" height="110" fill="url(#magic-light)" opacity=".9">
                        <animateTransform attributeName="transform" type="rotate" values="0 85 15;360 85 15" dur="1.2s"
                                          repeatCount="indefinite"/>
                    </rect>
                </g>
                <path d="M50 0v30M120 0v30" stroke="#DDE8FF" opacity=".55"/>
                <use href="#ai-mark" x="8" y="8" width="14" height="14" color="#FFFFFF"/>
                <text x="27" y="20" font-size="12" font-weight="700" fill="#FFFFFF">AI</text>
                <text x="62" y="20" font-size="12" font-weight="700" fill="#FFFFFF">Commit</text>
                <text x="130" y="20" font-size="12" font-weight="700" fill="#238449">Push</text>
                <use href="#push-mark" x="162" y="7" width="18" height="16" color="#238449"/>
                <rect x=".5" y=".5" width="189" height="29" rx="4" fill="none" stroke="#1F2937" opacity=".18"/>
            </g>
        </g>

        <g transform="translate(24 174)">
            <text x="0" y="19" font-size="12" fill="#5E6B7A">Push running</text>
            <g transform="translate(124 0)">
                <rect width="190" height="30" rx="4" fill="#EDF2FB"/>
                <path d="M4 0H50V30H4Q0 30 0 26V4Q0 0 4 0Z" fill="#2F6EEA"/>
                <rect x="50" width="70" height="30" fill="#315FAE"/>
                <path d="M120 0H186Q190 0 190 4V26Q190 30 186 30H120Z" fill="#1F7D4A"/>
                <g clip-path="url(#push-section-clip)">
                    <rect x="95" y="-40" width="120" height="110" fill="url(#magic-light)" opacity=".9">
                        <animateTransform attributeName="transform" type="rotate" values="0 155 15;360 155 15"
                                          dur="1.2s" repeatCount="indefinite"/>
                    </rect>
                </g>
                <path d="M50 0v30M120 0v30" stroke="#E9FFF3" opacity=".50"/>
                <use href="#ai-mark" x="8" y="8" width="14" height="14" color="#FFFFFF"/>
                <text x="27" y="20" font-size="12" font-weight="700" fill="#FFFFFF">AI</text>
                <text x="62" y="20" font-size="12" font-weight="700" fill="#FFFFFF">Commit</text>
                <text x="130" y="20" font-size="12" font-weight="700" fill="#FFFFFF">Push</text>
                <use href="#push-mark" x="162" y="7" width="18" height="16" color="#D9FFE3"/>
                <rect x=".5" y=".5" width="189" height="29" rx="4" fill="none" stroke="#1F2937" opacity=".18"/>
            </g>
        </g>
    </g>

    <g transform="translate(470 110)">
        <rect width="390" height="250" rx="8" fill="#1E2229" stroke="#3A4350"/>
        <text x="24" y="36" font-size="16" font-weight="700" fill="#E5E7EB">Dark theme</text>

        <g transform="translate(24 74)">
            <text x="0" y="19" font-size="12" fill="#AAB4C2">Staging + AI</text>
            <g transform="translate(124 0)">
                <rect width="190" height="30" rx="4" fill="#2B3340"/>
                <path d="M4 0H50V30H4Q0 30 0 26V4Q0 0 4 0Z" fill="#2E5EC5"/>
                <rect x="50" width="70" height="30" fill="#28394E"/>
                <path d="M120 0H186Q190 0 190 4V26Q190 30 186 30H120Z" fill="#263C32"/>
                <g clip-path="url(#ai-section-clip)">
                    <rect x="-20" y="-30" width="90" height="90" fill="url(#magic-dark)" opacity=".9">
                        <animateTransform attributeName="transform" type="rotate" values="0 25 15;360 25 15" dur="1.2s"
                                          repeatCount="indefinite"/>
                    </rect>
                </g>
                <path d="M50 0v30M120 0v30" stroke="#DBEAFE" opacity=".38"/>
                <use href="#ai-mark" x="8" y="8" width="14" height="14" color="#FFFFFF"/>
                <text x="27" y="20" font-size="12" font-weight="700" fill="#FFFFFF">AI</text>
                <text x="62" y="20" font-size="12" font-weight="700" fill="#BFD5FF">Commit</text>
                <text x="130" y="20" font-size="12" font-weight="700" fill="#8AF0A1">Push</text>
                <use href="#push-mark" x="162" y="7" width="18" height="16" color="#8AF0A1"/>
                <rect x=".5" y=".5" width="189" height="29" rx="4" fill="none" stroke="#FFFFFF" opacity=".20"/>
            </g>
        </g>

        <g transform="translate(24 124)">
            <text x="0" y="19" font-size="12" fill="#AAB4C2">Commit running</text>
            <g transform="translate(124 0)">
                <rect width="190" height="30" rx="4" fill="#2B3340"/>
                <path d="M4 0H50V30H4Q0 30 0 26V4Q0 0 4 0Z" fill="#355F9F"/>
                <rect x="50" width="70" height="30" fill="#2E5EC5"/>
                <path d="M120 0H186Q190 0 190 4V26Q190 30 186 30H120Z" fill="#263C32"/>
                <g clip-path="url(#commit-section-clip)">
                    <rect x="25" y="-40" width="120" height="110" fill="url(#magic-dark)" opacity=".9">
                        <animateTransform attributeName="transform" type="rotate" values="0 85 15;360 85 15" dur="1.2s"
                                          repeatCount="indefinite"/>
                    </rect>
                </g>
                <path d="M50 0v30M120 0v30" stroke="#DBEAFE" opacity=".38"/>
                <use href="#ai-mark" x="8" y="8" width="14" height="14" color="#D7E6FF"/>
                <text x="27" y="20" font-size="12" font-weight="700" fill="#FFFFFF">AI</text>
                <text x="62" y="20" font-size="12" font-weight="700" fill="#FFFFFF">Commit</text>
                <text x="130" y="20" font-size="12" font-weight="700" fill="#8AF0A1">Push</text>
                <use href="#push-mark" x="162" y="7" width="18" height="16" color="#8AF0A1"/>
                <rect x=".5" y=".5" width="189" height="29" rx="4" fill="none" stroke="#FFFFFF" opacity=".20"/>
            </g>
        </g>

        <g transform="translate(24 174)">
            <text x="0" y="19" font-size="12" fill="#AAB4C2">Push running</text>
            <g transform="translate(124 0)">
                <rect width="190" height="30" rx="4" fill="#2B3340"/>
                <path d="M4 0H50V30H4Q0 30 0 26V4Q0 0 4 0Z" fill="#355F9F"/>
                <rect x="50" width="70" height="30" fill="#2F5AA0"/>
                <path d="M120 0H186Q190 0 190 4V26Q190 30 186 30H120Z" fill="#238449"/>
                <g clip-path="url(#push-section-clip)">
                    <rect x="95" y="-40" width="120" height="110" fill="url(#magic-dark)" opacity=".9">
                        <animateTransform attributeName="transform" type="rotate" values="0 155 15;360 155 15"
                                          dur="1.2s" repeatCount="indefinite"/>
                    </rect>
                </g>
                <path d="M50 0v30M120 0v30" stroke="#DBEAFE" opacity=".38"/>
                <use href="#ai-mark" x="8" y="8" width="14" height="14" color="#EEF4FF"/>
                <text x="27" y="20" font-size="12" font-weight="700" fill="#FFFFFF">AI</text>
                <text x="62" y="20" font-size="12" font-weight="700" fill="#FFFFFF">Commit</text>
                <text x="130" y="20" font-size="12" font-weight="700" fill="#FFFFFF">Push</text>
                <use href="#push-mark" x="162" y="7" width="18" height="16" color="#D9FFE3"/>
                <rect x=".5" y=".5" width="189" height="29" rx="4" fill="none" stroke="#FFFFFF" opacity=".20"/>
            </g>
