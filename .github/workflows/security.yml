name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 3"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare Trivy report directory
        run: mkdir -p build/reports/trivy

      - name: Run Trivy filesystem scan
        id: trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          hide-progress: true
          format: 'sarif'
          output: 'build/reports/trivy/trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('build/reports/trivy/trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/trivy/trivy-results.sarif
          category: trivy

      - name: Upload Trivy reports artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: ai-commit-all-trivy-reports
          path: build/reports/trivy/**
          if-no-files-found: warn

      - name: Fail on Trivy findings
        if: ${{ steps.trivy-scan.outcome == 'failure' }}
        run: exit 1
