name: Plugin Verifier

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify against ${{ matrix.ide }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ide:
          - IU-2026.2
          - PY-2026.2
          - WS-2026.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          validate-wrappers: true

      - name: Run Plugin Verifier
        run: ./gradlew verifyPlugin -PpluginVerifierIdeVersions=${{ matrix.ide }}
