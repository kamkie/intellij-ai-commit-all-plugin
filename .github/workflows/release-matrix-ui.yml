name: Release Matrix UI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ide-products:
        description: "Comma-separated IDE product codes. IU runs the full lane; PY and WS run smoke lanes."
        required: true
        default: "IU,PY,WS"
      ide-version:
        description: "IDE version to run through the release-matrix UI lane."
        required: true
        default: "2026.2"

permissions:
  checks: write
  contents: read
  id-token: write

jobs:
  prepare-matrix:
    name: Prepare release-matrix UI products
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.products.outputs.matrix }}
    steps:
      - name: Select products
        id: products
        shell: bash
        env:
          IDE_PRODUCTS: ${{ inputs.ide-products || 'IU,PY,WS' }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          aliases = {
              "IIU": "IU",
              "PCP": "PY",
          }
          products = {
              "IU": {"code": "IU", "name": "IDEA full", "lane": "full"},
              "PY": {"code": "PY", "name": "PyCharm smoke", "lane": "smoke"},
              "WS": {"code": "WS", "name": "WebStorm smoke", "lane": "smoke"},
          }
          selected = []
          for raw_product in os.environ["IDE_PRODUCTS"].split(","):
              product = raw_product.strip().upper()
              if not product:
                  continue
              product = aliases.get(product, product)
              if product not in products:
                  print(f"Unsupported IDE product '{raw_product}'. Supported: IU, PY, WS.", file=sys.stderr)
                  sys.exit(1)
              if product not in selected:
                  selected.append(product)

          if not selected:
              print("At least one IDE product must be selected.", file=sys.stderr)
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps({'include': [products[product] for product in selected]})}\n")
          PY

  release-matrix-ui:
    name: Release matrix UI (${{ matrix.name }})
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          validate-wrappers: true

      - name: Prepare local act environment
        if: ${{ env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxi6 libxtst6 libxrender1 libxext6 libxss1 libnss3 libgtk-3-0
          mkdir -p /tmp/xdg-runtime
          chmod 700 /tmp/xdg-runtime
          echo "XDG_RUNTIME_DIR=/tmp/xdg-runtime" >> "${GITHUB_ENV}"
          chmod +x ./gradlew

      - name: Run release-matrix UI tests
        run: >
          xvfb-run -a ./gradlew --no-configuration-cache releaseMatrixUiTest
          -PideProducts="${{ matrix.code }}"
          -PideVersion="${{ inputs.ide-version || '2026.2' }}"

      - name: Verify release-matrix UI coverage data
        if: ${{ !env.ACT && success() }}
        run: |
          test -s build/jacoco/releaseMatrixUiIde.exec
          find build/jacoco/releaseMatrixUiClassDump -name '*.class' -type f -print -quit | grep -q .

      - name: Build release-matrix UI coverage report
        if: ${{ !env.ACT && success() && hashFiles('build/jacoco/releaseMatrixUiIde.exec') != '' }}
        run: ./gradlew jacocoAggregateReport

      - name: Publish release-matrix UI test summary
        if: ${{ !env.ACT && !cancelled() && hashFiles('build/test-results/releaseMatrixUiTest/*.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Release matrix UI tests (${{ matrix.name }})
          path: build/test-results/releaseMatrixUiTest/*.xml
          reporter: java-junit

      - name: Upload release-matrix UI evidence
        if: ${{ !env.ACT && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-release-matrix-ui-${{ matrix.code }}-evidence
          path: |
            build/test-results/releaseMatrixUiTest/*.xml
            build/reports/tests/releaseMatrixUiTest/**
            build/reports/releaseMatrixUiTest/**
            build/reports/jacoco/jacocoAggregateReport/**
            build/reports/jacoco/jacocoIntegrationReport/**
            build/jacoco/releaseMatrixUiIde.exec
            build/jacoco/releaseMatrixUiClassDump/**
            build/idea-sandbox/**/log/**
            out/ide-tests/tests/**/log/**
          if-no-files-found: warn
