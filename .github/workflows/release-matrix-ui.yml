name: Release Matrix UI

on:
  workflow_dispatch:
    inputs:
      ide-products:
        description: "Comma-separated IDE product codes. The Gradle task currently supports IU only."
        required: true
        default: "IU"
      ide-version:
        description: "IDE version to run through the release-matrix UI lane."
        required: true
        default: "2026.1.2"

permissions:
  checks: write
  contents: read

jobs:
  idea-ui:
    name: IDEA release-matrix UI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Run IDEA release-matrix UI tests
        run: >
          xvfb-run -a ./gradlew releaseMatrixUiTest
          -PideProducts="${{ inputs.ide-products }}"
          -PideVersion="${{ inputs.ide-version }}"

      - name: Publish release-matrix UI test summary
        if: ${{ !cancelled() && hashFiles('build/test-results/releaseMatrixUiTest/*.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Release matrix UI tests
          path: build/test-results/releaseMatrixUiTest/*.xml
          reporter: java-junit

      - name: Upload release-matrix UI evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-release-matrix-ui-evidence
          path: |
            build/test-results/releaseMatrixUiTest/*.xml
            build/reports/tests/releaseMatrixUiTest/**
            build/reports/releaseMatrixUiTest/**
            build/idea-sandbox/**/log/**
            out/ide-tests/tests/**/log/**
          if-no-files-found: warn
