name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Validate documentation
        shell: pwsh
        run: scripts/validate-docs.ps1

      - name: Test, generate coverage, verify plugin structure, and package
        run: ./gradlew test jacocoTestReport verifyPluginStructure buildPlugin

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: build/test-results/test/*.xml
          flags: unit
          name: ai-commit-all-unit-test-results
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          flags: unit
          name: ai-commit-all-unit-tests
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
