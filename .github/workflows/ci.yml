name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  checks: write
  contents: read
  id-token: write
  security-events: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Validate documentation and agent artifacts
        shell: pwsh
        run: scripts/ai/validate-agent-artifacts.ps1

      - name: Verify Detekt baseline is empty
        run: ./gradlew verifyDetektBaseline

      - name: Run Detekt static analysis
        id: detekt-analysis
        continue-on-error: true
        run: ./gradlew detekt

      - name: Upload Detekt SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('build/reports/detekt/detekt.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

      - name: Upload Detekt reports artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-detekt-reports
          path: build/reports/detekt/**
          if-no-files-found: warn

      - name: Test, generate coverage, verify plugin structure, and package
        id: gradle-validation
        run: ./gradlew test jacocoTestReport verifyJacocoCoverageReport verifyPluginStructure buildPlugin

      - name: Publish unit test summary
        if: ${{ !cancelled() && steps.gradle-validation.outcome != 'skipped' && hashFiles('build/test-results/test/*.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Gradle unit tests
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: Upload unit test results artifact
        if: ${{ !cancelled() && steps.gradle-validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-unit-test-results
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/**
          if-no-files-found: warn

      - name: Upload plugin ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Collect Codecov test result files
        id: codecov-test-results
        if: ${{ !cancelled() && steps.gradle-validation.outcome != 'skipped' && hashFiles('build/test-results/test/*.xml') != '' }}
        shell: bash
        run: |
          files=$(find build/test-results/test -name '*.xml' -type f | sort | paste -sd, -)
          if [ -z "${files}" ]; then
            echo "No Gradle JUnit XML test result files found for Codecov." >&2
            exit 1
          fi
          echo "files=${files}" >> "${GITHUB_OUTPUT}"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.codecov-test-results.outputs.files != '' }}
        uses: codecov/codecov-action@v6
        with:
          files: ${{ steps.codecov-test-results.outputs.files }}
          flags: unit
          name: ai-commit-all-unit-test-results
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          flags: unit
          name: ai-commit-all-unit-tests
          report_type: coverage
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

      - name: Fail on Detekt findings
        if: ${{ steps.detekt-analysis.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::Detekt found static analysis issues. See the report excerpt below and the ai-commit-all-detekt-reports artifact."

          markdown_report="build/reports/detekt/detekt.md"
          xml_report="build/reports/detekt/detekt.xml"

          if [ -f "${markdown_report}" ]; then
            echo "## Detekt findings" >> "${GITHUB_STEP_SUMMARY}"
            cat "${markdown_report}" >> "${GITHUB_STEP_SUMMARY}"

            echo "::group::Detekt Markdown report"
            cat "${markdown_report}"
            echo "::endgroup::"
          elif [ -f "${xml_report}" ]; then
            echo "Detekt Markdown report was not found; showing the first 200 lines of the Checkstyle XML report."
            echo "::group::Detekt Checkstyle XML report"
            sed -n '1,200p' "${xml_report}"
            echo "::endgroup::"
          else
            echo "Detekt report files were not found. Available build/reports files:"
            find build/reports -maxdepth 3 -type f | sort || true
          fi

          exit 1
