name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  checks: write
  contents: read
  id-token: write
  security-events: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Validate documentation
        shell: pwsh
        run: scripts/validate-docs.ps1

      - name: Run Detekt static analysis
        id: detekt-analysis
        continue-on-error: true
        run: ./gradlew detekt

      - name: Upload Detekt SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('build/reports/detekt/detekt.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

      - name: Upload Detekt reports artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-detekt-reports
          path: build/reports/detekt/**
          if-no-files-found: warn

      - name: Test, generate coverage, verify plugin structure, and package
        id: gradle-validation
        run: ./gradlew test jacocoTestReport verifyJacocoCoverageReport verifyPluginStructure buildPlugin

      - name: Publish unit test summary
        if: ${{ !cancelled() && steps.gradle-validation.outcome != 'skipped' && hashFiles('build/test-results/test/*.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Gradle unit tests
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: Upload unit test results artifact
        if: ${{ !cancelled() && steps.gradle-validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-unit-test-results
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/**
          if-no-files-found: warn

      - name: Upload plugin ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Collect Codecov test result files
        id: codecov-test-results
        if: ${{ !cancelled() && steps.gradle-validation.outcome != 'skipped' && hashFiles('build/test-results/test/*.xml') != '' }}
        shell: bash
        run: |
          files=$(find build/test-results/test -name '*.xml' -type f | sort | paste -sd, -)
          if [ -z "${files}" ]; then
            echo "No Gradle JUnit XML test result files found for Codecov." >&2
            exit 1
          fi
          echo "files=${files}" >> "${GITHUB_OUTPUT}"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.codecov-test-results.outputs.files != '' }}
        uses: codecov/codecov-action@v6
        with:
          files: ${{ steps.codecov-test-results.outputs.files }}
          flags: unit
          name: ai-commit-all-unit-test-results
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          flags: unit
          name: ai-commit-all-unit-tests
          report_type: coverage
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

      - name: Fail on Detekt findings
        if: ${{ steps.detekt-analysis.outcome == 'failure' }}
        run: exit 1
