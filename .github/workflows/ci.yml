name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  checks: write
  contents: read
  id-token: write
  security-events: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          validate-wrappers: true

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Validate documentation and agent artifacts
        shell: pwsh
        run: scripts/validate-docs.ps1

      - name: Verify Detekt baseline is empty
        run: ./gradlew verifyDetektBaseline

      - name: Run Detekt static analysis
        id: detekt-analysis
        continue-on-error: true
        run: ./gradlew detekt

      - name: Upload Detekt SARIF to code scanning
        if: ${{ !env.ACT && !cancelled() && hashFiles('build/reports/detekt/detekt.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

      - name: Upload Detekt reports artifact
        if: ${{ !env.ACT && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-detekt-reports
          path: build/reports/detekt/**
          if-no-files-found: warn

      - name: Test, generate coverage, verify plugin structure, and package
        id: gradle-validation
        run: ./gradlew test jacocoTestReport verifyJacocoCoverageReport verifyPluginStructure buildPlugin

      - name: Publish unit test summary
        if: ${{ !env.ACT && !cancelled() && steps.gradle-validation.outcome != 'skipped' && hashFiles('build/test-results/test/*.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Gradle unit tests
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: Upload unit test results artifact
        if: ${{ !env.ACT && !cancelled() && steps.gradle-validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-unit-test-results
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/**
          if-no-files-found: warn

      - name: Upload unit coverage report artifact
        if: ${{ !env.ACT && !cancelled() && steps.gradle-validation.outcome != 'skipped' && hashFiles('build/reports/jacoco/test/jacocoTestReport.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-unit-coverage
          path: build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error

      - name: Upload plugin ZIP artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Collect Codecov test result files
        id: codecov-test-results
        if: ${{ !env.ACT && !cancelled() && steps.gradle-validation.outcome != 'skipped' && hashFiles('build/test-results/test/*.xml') != '' }}
        shell: bash
        run: |
          files=$(find build/test-results/test -name '*.xml' -type f | sort | paste -sd, -)
          if [ -z "${files}" ]; then
            echo "No Gradle JUnit XML test result files found for Codecov." >&2
            exit 1
          fi
          echo "files=${files}" >> "${GITHUB_OUTPUT}"

      - name: Upload test results to Codecov
        if: ${{ !env.ACT && !cancelled() && steps.codecov-test-results.outputs.files != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: ${{ steps.codecov-test-results.outputs.files }}
          flags: unit
          name: ai-commit-all-unit-test-results
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

      - name: Fail on Detekt findings
        if: ${{ steps.detekt-analysis.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::Detekt found static analysis issues. See the report excerpt below and the ai-commit-all-detekt-reports artifact."

          markdown_report="build/reports/detekt/detekt.md"
          xml_report="build/reports/detekt/detekt.xml"

          if [ -f "${markdown_report}" ]; then
            echo "## Detekt findings" >> "${GITHUB_STEP_SUMMARY}"
            cat "${markdown_report}" >> "${GITHUB_STEP_SUMMARY}"

            echo "::group::Detekt Markdown report"
            cat "${markdown_report}"
            echo "::endgroup::"
          elif [ -f "${xml_report}" ]; then
            echo "Detekt Markdown report was not found; showing the first 200 lines of the Checkstyle XML report."
            echo "::group::Detekt Checkstyle XML report"
            sed -n '1,200p' "${xml_report}"
            echo "::endgroup::"
          else
            echo "Detekt report files were not found. Available build/reports files:"
            find build/reports -maxdepth 3 -type f | sort || true
          fi

          exit 1

  ui-coverage:
    name: UI coverage
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          validate-wrappers: true

      - name: Download unit coverage report
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          name: ai-commit-all-unit-coverage
          path: build/reports/jacoco/unit

      - name: Prepare local act environment
        if: ${{ env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxi6 libxtst6 libxrender1 libxext6 libxss1 libnss3 libgtk-3-0
          mkdir -p /tmp/xdg-runtime
          chmod 700 /tmp/xdg-runtime
          echo "XDG_RUNTIME_DIR=/tmp/xdg-runtime" >> "${GITHUB_ENV}"
          chmod +x ./gradlew

      - name: Run release-matrix UI smoke coverage
        run: >
          xvfb-run -a ./gradlew --no-configuration-cache releaseMatrixUiTest
          -PideProducts=PY
          -PideVersion=2026.2

      - name: Upload release-matrix UI failure evidence
        if: ${{ !env.ACT && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-commit-all-ui-coverage-failure-evidence
          path: |
            build/test-results/releaseMatrixUiTest/*.xml
            build/reports/tests/releaseMatrixUiTest/**
            build/reports/releaseMatrixUiTest/**
            build/idea-sandbox/**/log/**
            out/ide-tests/tests/**/log/**
          if-no-files-found: warn

      - name: Verify CI coverage inputs
        if: ${{ !env.ACT && success() }}
        run: |
          test -s build/reports/jacoco/unit/jacocoTestReport.xml
          test -s build/jacoco/releaseMatrixUiIde.exec
          find build/jacoco/releaseMatrixUiClassDump -name '*.class' -type f -print -quit | grep -q .

      - name: Build aggregate coverage report
        if: ${{ !env.ACT && success() && hashFiles('build/jacoco/releaseMatrixUiIde.exec') != '' }}
        run: >
          ./gradlew --no-configuration-cache jacocoAggregateReport
          -Paicommitall.unitJacocoXmlReport=build/reports/jacoco/unit/jacocoTestReport.xml

      - name: Upload aggregate coverage to Codecov
        if: ${{ !env.ACT && !cancelled() && hashFiles('build/reports/jacoco/jacocoAggregateReport/jacocoAggregateReport.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: build/reports/jacoco/jacocoAggregateReport/jacocoAggregateReport.xml
          # Keep the historical unit stream so Codecov's branch graph and trend
          # continue from the same series, while still exposing the aggregate flag.
          flags: unit,aggregate
          name: ai-commit-all-unit-tests
          report_type: coverage
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
